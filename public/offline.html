<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Offline · Rentless</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #020617;
          color: #f8fafc;
        }
        .card {
          background: #0f172a;
          border-color: rgba(255, 255, 255, 0.12);
        }
        .muted {
          color: #94a3b8;
        }
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      }
      .mark {
        width: 48px;
        height: 48px;
        border-radius: 13px;
        margin: 0 auto 16px;
        display: grid;
        place-items: center;
        background: #4f46e5;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 6px;
        font-size: 14px;
        line-height: 1.5;
      }
      .muted {
        color: #64748b;
      }
      button {
        margin-top: 20px;
        width: 100%;
        padding: 12px 16px;
        font-size: 15px;
        font-weight: 600;
        color: #ffffff;
        background: #4f46e5;
        border: 0;
        border-radius: 10px;
        cursor: pointer;
      }
      button:hover {
        background: #4338ca;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="30" height="30">
          <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15.5 18.5 24 11.5l8.5 7" />
            <path d="M19 24.5h10" />
            <path d="M19 29.5h8.5" />
            <path d="M19.5 23.5v15" />
            <path d="M25 29.5 31 38" />
          </g>
        </svg>
      </div>
      <h1>You&rsquo;re offline</h1>
      <p class="muted">
        Rentless needs a connection for the latest numbers. Reconnect and we&rsquo;ll refresh your
        rent details.
      </p>
      <p class="muted">आप ऑफ़लाइन हैं — कनेक्ट करके फिर कोशिश करें।</p>
      <button type="button" onclick="window.location.reload()">Retry · फिर कोशिश करें</button>
    </main>
  </body>
</html>
